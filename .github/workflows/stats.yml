name: Generate profile stats

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render stat cards
        run: node .github/scripts/stats.mjs
        env:
          # STATS_TOKEN is optional: a classic PAT with read:user also counts
          # private contributions. Without it the built-in token covers
          # everything public.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh profile stats [skip ci]"
          git push
