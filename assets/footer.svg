<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="decorative animated wave footer">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="w2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <g>
    <path fill="url(#w1)" opacity="0.30"
      d="M0,86 q75,-26 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 L2400,150 L0,150 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w2)" opacity="0.38"
      d="M0,98 q75,-22 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 L2400,150 L0,150 Z">
      <animateTransform attributeName="transform" type="translate" from="-300 0" to="0 0" dur="13s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w1)" opacity="0.9"
      d="M0,112 q75,-18 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 L2400,150 L0,150 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="17s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#8b93b8" text-anchor="middle">
    <text x="600" y="46" letter-spacing="3">
      Optimize first, cry later.
      <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
