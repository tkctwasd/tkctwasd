<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="WASD - Unity Mobile Game Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080f"/>
      <stop offset="0.55" stop-color="#0d0b1e"/>
      <stop offset="1" stop-color="#140f26"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#a78bfa;#f472b6;#818cf8" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#818cf8;#a78bfa" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#818cf8;#a78bfa;#f472b6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="auroraA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b93ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clip0"><rect x="82" y="212" width="0" height="28">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;441;441;0;0" keyTimes="0;0.125;0.290;0.325;1"/>
    </rect></clipPath>
    <clipPath id="clip1"><rect x="82" y="212" width="0" height="28">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;428;428;0;0" keyTimes="0;0.3333;0.4583;0.6233;0.6583;1"/>
    </rect></clipPath>
    <clipPath id="clip2"><rect x="82" y="212" width="0" height="28">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;302;302;0;0" keyTimes="0;0.6667;0.7917;0.9567;0.9917;1"/>
    </rect></clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <g filter="url(#blurLg)">
    <ellipse cx="250" cy="90" rx="260" ry="150" fill="url(#auroraA)">
      <animate attributeName="cx" values="250;420;250" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;150;90" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="220" rx="280" ry="160" fill="url(#auroraB)">
      <animate attributeName="cx" values="960;800;960" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;110;220" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g transform="translate(1010 150)" opacity="0.95">
    <g fill="none" stroke="#a78bfa" stroke-opacity="0.35">
      <ellipse rx="96" ry="34">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="96" ry="34" stroke="#818cf8" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="24s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="96" ry="34" stroke="#f472b6" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="30s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g filter="url(#glowSm)">
      <path d="M0 -42 L36 -21 L36 21 L0 42 L-36 21 L-36 -21 Z" fill="none" stroke="url(#brand)" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </path>
      <circle r="7" fill="#f472b6">
        <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle r="3.2" fill="#818cf8">
      <animateMotion dur="24s" repeatCount="indefinite" path="M96,0 A96,34 0 1,1 -96,0 A96,34 0 1,1 96,0"/>
    </circle>
    <circle r="2.6" fill="#f9a8d4">
      <animateMotion dur="30s" repeatCount="indefinite" path="M-96,0 A96,34 0 1,1 96,0 A96,34 0 1,1 -96,0"/>
    </circle>
  </g>

  <g fill="#a5b4fc">
    <circle cx="180" cy="250" r="2" opacity="0.6"><animate attributeName="cy" values="250;210;250" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="70" r="1.6" opacity="0.5"><animate attributeName="cy" values="70;110;70" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="240" r="2.2" opacity="0.45"><animate attributeName="cy" values="240;196;240" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="120" r="1.4" opacity="0.55"><animate attributeName="cx" values="640;690;640" dur="13s" repeatCount="indefinite"/></circle>
  </g>

  <text x="82" y="86" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600"
        letter-spacing="5" fill="#7c86a8">NGUYEN MINH DONG &#183; VIETNAM</text>

  <text x="80" y="164" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="82" font-weight="800"
        letter-spacing="1" fill="url(#brand)">WASD</text>

  <text x="84" y="194" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="500"
        letter-spacing="1.5" fill="#93a0c0">Unity Mobile Game Developer</text>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#c4b5fd">
    <text x="82" y="232" clip-path="url(#clip0)">Unity &#183; URP &#183; IL2CPP &#183; Burst + Jobs</text>
    <text x="82" y="232" clip-path="url(#clip1)">Custom HLSL &#183; GPU Instancing &#183; SRP</text>
    <text x="82" y="232" clip-path="url(#clip2)">60 FPS on potato phones.</text>
  </g>

  <g fill="#f472b6">
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.30;0.33;1"/>
      <rect y="213" width="11" height="24" x="82">
        <animate attributeName="x" dur="12s" repeatCount="indefinite" values="82;502;502;82;82" keyTimes="0;0.125;0.290;0.325;1"/>
        <animate attributeName="opacity" values="1;1;0.1;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3433;0.6333;0.6633;1"/>
      <rect y="213" width="11" height="24" x="82">
        <animate attributeName="x" dur="12s" repeatCount="indefinite" values="82;82;490;490;82;82" keyTimes="0;0.3333;0.4583;0.6233;0.6583;1"/>
        <animate attributeName="opacity" values="1;1;0.1;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6767;0.9667;0.9967;1"/>
      <rect y="213" width="11" height="24" x="82">
        <animate attributeName="x" dur="12s" repeatCount="indefinite" values="82;82;370;370;82;82" keyTimes="0;0.6667;0.7917;0.9567;0.9917;1"/>
        <animate attributeName="opacity" values="1;1;0.1;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="0" y="277" width="1200" height="2" fill="url(#rule)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
